<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 70" fill="none">
  <!-- Badge frame -->
  <rect x="1" y="1" width="68" height="68" rx="15" fill="#1a3d2b"/>
  <clipPath id="b">
    <rect x="1" y="1" width="68" height="68" rx="15"/>
  </clipPath>
  <g clip-path="url(#b)">
    <!-- Sky -->
    <rect x="1" y="1" width="68" height="44" fill="#0d2318"/>
    <!-- Ground -->
    <rect x="1" y="45" width="68" height="24" fill="#1c4a2a"/>
    <!-- Far mountain -->
    <polygon points="1,68 26,16 51,68" fill="#2f6a4a"/>
    <!-- Near mountain -->
    <polygon points="22,70 46,22 70,70" fill="#163820"/>
    <!-- Snow cap -->
    <polygon points="46,22 50,32 42,32" fill="#ffffff" opacity="0.3"/>
    <!-- Sun glow -->
    <circle cx="56" cy="14" r="13" fill="#d4af37" opacity="0.18"/>
    <!-- Sun -->
    <circle cx="56" cy="14" r="9" fill="#d4af37"/>
    <!-- River/reflection -->
    <rect x="1" y="56" width="68" height="3" fill="#4fb8b2" opacity="0.2"/>
  </g>
  <!-- Badge gold border -->
  <rect x="1" y="1" width="68" height="68" rx="15" fill="none" stroke="#d4af37" stroke-width="1.8"/>
  <!-- Vertical divider -->
  <line x1="83" y1="9" x2="83" y2="61" stroke="#d4af37" stroke-width="0.8" opacity="0.45"/>
  <!-- Tenkasi text -->
  <text x="95" y="30" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.3">Tenkasi</text>
  <!-- Fresh text (gold) -->
  <text x="95" y="56" font-family="Georgia,'Times New Roman',serif" font-size="20" font-weight="700" fill="#d4af37" letter-spacing="0.5">Fresh</text>
  <!-- Tagline dots -->
  <circle cx="95" cy="37" r="1.2" fill="#d4af37" opacity="0.5"/>
  <circle cx="100" cy="37" r="1.2" fill="#d4af37" opacity="0.5"/>
  <circle cx="105" cy="37" r="1.2" fill="#d4af37" opacity="0.5"/>
</svg>
